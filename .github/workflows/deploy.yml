name: Build and Push to ACR

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com
  ACR_NAMESPACE: lov0u
  IMAGE_NAME: yushitou-cn
  SITE_SLUG: yushitou-cn
  PORT: 3003

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com/lov0u/yushitou-cn:latest
          crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com/lov0u/yushitou-cn:${{ github.sha }}

    - name: Deploy to server
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          echo "=== Deploy yushitou-cn ==="
          echo "Login ACR..."
          docker login crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}
          echo "Pull image..."
          docker pull crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com/lov0u/yushitou-cn:latest
          echo "Stop old container..."
          docker stop yushitou-cn || true
          docker rm yushitou-cn || true
          echo "Start new container..."
          docker run -d \
            --name yushitou-cn \
            --restart always \
            -p 3003:3000 \
            -e NODE_ENV=production \
            crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com/lov0u/yushitou-cn:latest
          echo "Prune old images..."
          docker image prune -f
          echo "Done!"
